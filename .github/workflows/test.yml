name: .NET Tests

env:
  SmtpSettings__Host: "localhost"
  SmtpSettings__Port: "1025"
  SmtpSettings__UseSsl: "false"
  SmtpSettings__SenderEmail: "noreply@example.com"
  SmtpSettings__SenderName: "Base Account System"
  Jwt__SigningKey: ${{ secrets.SigningKey }}

on:
  pull_request:
    branches: [ "main", "master" ]
  push:
    branches: [ "main", "master" ]

jobs:
  run-tests:
    runs-on: ubuntu-latest

    services:
      mailpit:
        image: axllent/mailpit:latest
        ports:
          - 1025:1025
          - 8025:8025

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore

    - name: Build project
      run: dotnet build --no-restore --configuration Release

    - name: Execute unit tests
      run: dotnet test --no-build --configuration Release --verbosity normal
